# Demo: arbitration protects a mission-critical node from CPU hogs.
#
# perception (mission-critical, normal scheduling) shares CPU 0 with two
# best-effort CPU hogs and brake_control (SCHED_FIFO). The hogs make
# perception wait for CPU and miss its 30 ms deadline (it needs 40% of CPU 0,
# but its fair share next to the hogs is only about 27%). The manager sees the
# pressure (PSI) and the misses, and degrades the hogs step by step:
# throttle (cpu.max 10%) -> deactivate -> stop - only as far as needed.
#
#   ... build/vrm_manager config/demo_arbitration.yaml --exit-after 30
#   ... build/vrm_manager config/demo_arbitration.yaml --no-arbitration --exit-after 30
system: demo_arbitration
transition_timeout_ms: 3000

arbitration:
  cpu_pressure_threshold: 0.25   # waiting for CPU above 25% of the time: throttle hogs
  miss_rounds: 2                 # deadline misses in 2 rounds in a row: deactivate / stop
  escalation_interval_s: 2
  recovery_s: 10
  throttle_cpu: 0.1

nodes:
  - name: brake_control
    executable: vrm_demo_node
    args: ["--period-ms", "10", "--work-ms", "2", "--deadline-ms", "4"]
    criticality: safety_critical
    priority: 80
    resources: {memory: 64Mi, cpus: [0]}

  - name: perception
    executable: vrm_demo_node
    args: ["--period-ms", "50", "--work-ms", "20", "--deadline-ms", "30"]
    criticality: mission_critical
    resources: {memory: 128Mi, cpus: [0]}

  - name: map_renderer
    executable: vrm_demo_node
    args: ["--period-ms", "10", "--work-ms", "10", "--no-deadline"]
    criticality: best_effort
    resources: {cpu: 1.0, memory: 128Mi, cpus: [0]}

  - name: infotainment
    executable: vrm_demo_node
    args: ["--period-ms", "10", "--work-ms", "10", "--no-deadline"]
    criticality: best_effort
    resources: {cpu: 1.0, memory: 128Mi, cpus: [0]}
