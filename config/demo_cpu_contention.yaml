# Demo: two CPU hogs share CPU 0 with brake_control.
#
# brake_control has 2 ms of work every 10 ms and must finish within 4 ms.
# With normal scheduling it has to share CPU 0 with the hogs and misses its
# deadline; with SCHED_FIFO 80 it preempts them and always finishes in time.
#
#   ... build/vrm_manager config/demo_cpu_contention.yaml --no-rt --exit-after 8
#   ... build/vrm_manager config/demo_cpu_contention.yaml --exit-after 8
system: demo_cpu_contention
transition_timeout_ms: 3000

nodes:
  - name: brake_control
    executable: vrm_demo_node
    args: ["--period-ms", "10", "--work-ms", "2", "--deadline-ms", "4"]
    criticality: safety_critical
    priority: 80
    resources:
      memory: 64Mi
      cpus: [0]

  # The hogs model batch work that keeps a core busy; they have no deadline.
  - name: map_renderer
    executable: vrm_demo_node
    args: ["--period-ms", "10", "--work-ms", "10", "--no-deadline"]
    criticality: best_effort
    resources:
      memory: 128Mi
      cpus: [0]

  - name: infotainment
    executable: vrm_demo_node
    args: ["--period-ms", "10", "--work-ms", "10", "--no-deadline"]
    criticality: best_effort
    resources:
      memory: 128Mi
      cpus: [0]
