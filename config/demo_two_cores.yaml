# Demo: watch the scheduler place nodes on two CPUs.
#
# brake_control is pinned to CPU 1 (SCHED_FIFO). perception and two CPU hogs
# may run on CPU 0 or 1, so the scheduler moves them between the CPUs and
# switches between them many times per second. Run with a CPU timeline:
#
#   ... build/vrm_manager config/demo_two_cores.yaml --trace-cpus 0,1 \
#         --status-file status/status.json --status-interval 0.25 --report-interval 0
#
# The dashboard then shows, per CPU, which node ran when in the last 2 s.
system: demo_two_cores
transition_timeout_ms: 3000

nodes:
  - name: brake_control
    executable: vrm_demo_node
    args: ["--period-ms", "10", "--work-ms", "2", "--deadline-ms", "4"]
    criticality: safety_critical
    priority: 80
    resources: {memory: 64Mi, cpus: [1]}

  - name: perception
    executable: vrm_demo_node
    args: ["--period-ms", "50", "--work-ms", "20", "--deadline-ms", "30"]
    criticality: mission_critical
    resources: {memory: 128Mi, cpus: [0, 1]}

  - name: infotainment
    executable: vrm_demo_node
    args: ["--period-ms", "10", "--work-ms", "10", "--no-deadline"]
    criticality: best_effort
    resources: {memory: 128Mi, cpus: [0, 1]}

  - name: map_renderer
    executable: vrm_demo_node
    args: ["--period-ms", "10", "--work-ms", "10", "--no-deadline"]
    criticality: best_effort
    resources: {memory: 128Mi, cpus: [0, 1]}
