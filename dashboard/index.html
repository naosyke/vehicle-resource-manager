<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resource Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --track: #f0efec;
    --border: rgba(11, 11, 11, 0.10);
    --usage: #2a78d6;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --chip: #e8f0fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --grid: #2c2c2a;
      --axis: #383835;
      --track: #262624;
      --border: rgba(255, 255, 255, 0.10);
      --usage: #3987e5;
      --chip: #1d2c40;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --grid: #2c2c2a;
    --axis: #383835;
    --track: #262624;
    --border: rgba(255, 255, 255, 0.10);
    --usage: #3987e5;
    --chip: #1d2c40;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
  .muted { color: var(--text-muted); }
  .secondary { color: var(--text-secondary); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 12px;
    min-width: 0;
  }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); }
  .status svg { flex: none; }

  /* CPU core map */
  .cores { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .core { border: 1px solid var(--border); border-radius: 6px; padding: 8px; min-height: 76px; }
  .core-name { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .chip {
    display: inline-block; background: var(--chip); border-radius: 4px; padding: 1px 6px;
    font-size: 12px; margin: 0 4px 4px 0; white-space: nowrap;
  }
  .core-note { font-size: 11px; color: var(--text-muted); }
  .unpinned { margin-top: 10px; font-size: 13px; color: var(--text-secondary); }

  /* Nodes */
  .node { display: grid; grid-template-columns: 210px minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 12px 0; border-top: 1px solid var(--border); }
  .node:first-of-type { border-top: 0; padding-top: 0; }
  .node-name { font-weight: 600; }
  .node-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .node-flags { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
  .metric-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; margin-bottom: 4px; }
  .metric-head .label { color: var(--text-secondary); }
  .metric-head .value { font-variant-numeric: tabular-nums; text-align: right; }
  .bar { position: relative; height: 10px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--usage); border-radius: 4px; }
  .bar .peak { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text-muted); }
  .spark { position: relative; margin-top: 6px; }
  .spark svg { display: block; width: 100%; height: 44px; overflow: visible; }
  .axis-text { fill: var(--text-muted); font-size: 10px; }
  .tooltip {
    position: absolute; pointer-events: none; display: none; white-space: nowrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 3px 7px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); z-index: 2;
  }

  /* Events */
  .log { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow-y: auto; font-size: 12px; }
  .log li { display: grid; grid-template-columns: 68px 18px minmax(0, 1fr); gap: 6px; padding: 4px 0; border-top: 1px solid var(--border); align-items: start; }
  .log time { color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .empty { color: var(--text-muted); padding: 24px 0; text-align: center; }

  @media (max-width: 820px) {
    .node { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Resource Dashboard <span class="muted" id="system"></span></h1>
    <span class="status" id="connection"></span>
    <span class="status" id="enforcement"></span>
  </header>

  <section class="card">
    <h2>CPU cores <span class="muted">(which node may run where)</span></h2>
    <div class="cores" id="cores"></div>
    <div class="unpinned" id="unpinned"></div>
  </section>

  <section class="card">
    <h2>Nodes <span class="muted">(usage against budget; charts show the last 60 s, dashed line = limit)</span></h2>
    <div id="nodes"><div class="empty">Waiting for status/status.json…</div></div>
  </section>

  <section class="card">
    <h2>Events</h2>
    <ul class="log" id="log"></ul>
  </section>
</main>

<script>
const STATUS_URL = "../status/status.json";
const HISTORY_SECONDS = 60;
const NEAR_LIMIT = 0.8;
const SVG_NS = "http://www.w3.org/2000/svg";

const ICONS = {
  good: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="var(--good)"/></svg>',
  idle: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="var(--text-muted)" stroke-width="1.5"/></svg>',
  warning: '<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 15 14H1z" fill="var(--warning)"/><path d="M8 6v3.5M8 11.3v.2" stroke="#0b0b0b" stroke-width="1.6" stroke-linecap="round"/></svg>',
  critical: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1" width="10" height="10" rx="2" fill="var(--critical)"/><path d="M4 4l4 4M8 4l-4 4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>',
};

const history = {};  // node -> [{t, cpu, mem}] with values as fractions of the budget
let hover = null;    // {key, clientX}: keeps a tooltip open across 1 s redraws

function status(kind, label) {
  return `<span class="status">${ICONS[kind]}<span>${escapeHtml(label)}</span></span>`;
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

function formatBytes(bytes) {
  const units = ["B", "Ki", "Mi", "Gi"];
  let value = bytes, unit = 0;
  while (value >= 1024 && unit < 3) { value /= 1024; unit++; }
  return unit === 0 ? `${value}B` : `${value.toFixed(1)}${units[unit]}`;
}

function nodeStatus(node) {
  if (node.running && node.state === "active") return status("good", "active");
  if (node.outcome === "exited") return status("critical", node.detail || "exited");
  if (node.outcome === "failed") return status("critical", "failed");
  if (node.outcome === "skipped") return status("idle", "skipped");
  if (node.outcome === "stopped") return status("idle", "stopped");
  return status("idle", node.state.replace("_", " "));
}

// ---------- CPU core map ----------

function renderCores(data) {
  const cpus = data.available_cpus;
  const pinned = data.nodes.filter((n) => n.budget.cpus.length);
  const unpinned = data.nodes.filter((n) => !n.budget.cpus.length && n.outcome !== "skipped" && n.outcome !== "not started");
  const coresEl = document.getElementById("cores");

  if (!cpus.length) {
    coresEl.innerHTML = '<div class="muted">CPU sets are not enforced (cgroups unavailable).</div>';
  } else {
    coresEl.innerHTML = cpus.map((cpu) => {
      const owners = pinned.filter((n) => n.budget.cpus.includes(cpu));
      const chips = owners.map((n) => `<span class="chip">${escapeHtml(n.name)}</span>`).join("");
      const shared = owners.length && unpinned.length
        ? `<div class="core-note">shared with ${unpinned.length} unpinned node${unpinned.length > 1 ? "s" : ""}</div>` : "";
      return `<div class="core"><div class="core-name">CPU ${cpu}</div>${chips}${shared}</div>`;
    }).join("");
  }

  document.getElementById("unpinned").innerHTML = unpinned.length
    ? `Any core: ${unpinned.map((n) => `<span class="chip">${escapeHtml(n.name)}</span>`).join("")}`
    : "";
}

// ---------- nodes ----------

function metric(label, value, fraction, peakFraction, warn) {
  const width = Math.max(0, Math.min(1, fraction)) * 100;
  const peak = peakFraction == null ? "" :
    `<div class="peak" style="left: calc(${Math.min(1, peakFraction) * 100}% - 1px)" title="peak"></div>`;
  return `
    <div class="metric-head"><span class="label">${label}</span><span class="value">${value}</span></div>
    <div class="bar" role="img" aria-label="${label}: ${value}">
      <div class="fill" style="width: ${width}%; ${warn ? "background: var(--warning)" : ""}"></div>${peak}
    </div>`;
}

function renderNodes(data) {
  const container = document.getElementById("nodes");
  const now = data.timestamp;
  container.innerHTML = "";

  for (const node of data.nodes) {
    const usage = node.usage;
    const budget = node.budget;
    const row = document.createElement("div");
    row.className = "node";

    // Budget-relative values; without a limit, CPU is relative to one core.
    const cpuLimit = budget.cpu_cores ? budget.cpu_cores * 100 : 100;
    const cpuFraction = usage ? usage.cpu_percent / cpuLimit : 0;
    const memLimit = budget.memory_bytes;
    const memFraction = usage && memLimit ? usage.memory_bytes / memLimit : 0;
    const peakFraction = usage && memLimit ? usage.memory_peak_bytes / memLimit : null;

    if (usage && node.running) {
      const points = history[node.name] || (history[node.name] = []);
      if (!points.length || points[points.length - 1].t !== now) {
        points.push({t: now, cpu: cpuFraction, mem: memLimit ? memFraction : null,
                     cpuText: `${usage.cpu_percent.toFixed(1)}%`, memText: formatBytes(usage.memory_bytes)});
      }
      while (points.length && points[0].t < now - HISTORY_SECONDS) points.shift();
    }

    const flags = [];
    // An OOM exit is already the node's status line.
    if (usage && usage.oom_kills && node.outcome !== "exited") flags.push(status("critical", `OOM killed ×${usage.oom_kills}`));
    if (usage && usage.nr_throttled) flags.push(status("warning", `CPU throttled ${usage.nr_throttled}×`));
    if (usage && node.running && memLimit && memFraction >= NEAR_LIMIT) flags.push(status("warning", "memory near limit"));

    const cpuValue = usage
      ? `${usage.cpu_percent.toFixed(1)}% of ${budget.cpu_cores ? `${cpuLimit.toFixed(0)}%` : "no limit"}`
      : "not measured";
    const memValue = usage
      ? `${formatBytes(usage.memory_bytes)} / ${memLimit ? formatBytes(memLimit) : "no limit"} · peak ${formatBytes(usage.memory_peak_bytes)}`
      : "not measured";
    const pinnedText = budget.cpus.length ? `CPU ${budget.cpus.join(", ")}` : "any CPU";
    const priorityText = node.priority ? `priority ${node.priority}` : "normal priority";

    row.innerHTML = `
      <div>
        <div class="node-name">${escapeHtml(node.name)}</div>
        <div class="node-meta">${escapeHtml(node.criticality.replace("_", " "))} · ${priorityText} · ${pinnedText}</div>
        <div class="node-flags">${nodeStatus(node)}${flags.join("")}</div>
      </div>
      <div>
        ${metric("CPU", cpuValue, cpuFraction, null, false)}
        <div class="spark" data-kind="cpu"><svg role="img" aria-label="CPU over time"></svg><div class="tooltip"></div></div>
      </div>
      <div>
        ${metric("Memory", memValue, memFraction, peakFraction, node.running && memLimit && memFraction >= NEAR_LIMIT)}
        <div class="spark" data-kind="mem"><svg role="img" aria-label="Memory over time"></svg><div class="tooltip"></div></div>
      </div>`;
    container.append(row);

    const points = history[node.name] || [];
    drawSpark(row.querySelector('[data-kind="cpu"]'), `${node.name}/cpu`, points, "cpu", "cpuText", now);
    if (memLimit) drawSpark(row.querySelector('[data-kind="mem"]'), `${node.name}/mem`, points, "mem", "memText", now);
  }
}

function el(name, attrs, parent) {
  const node = document.createElementNS(SVG_NS, name);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (parent) parent.append(node);
  return node;
}

// Sparkline of a budget fraction; 1.0 (the limit) is the dashed line.
function drawSpark(container, hoverKey, points, key, textKey, now) {
  const svg = container.querySelector("svg");
  const width = svg.clientWidth, height = svg.clientHeight;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.replaceChildren();
  if (!width) return;

  const top = Math.max(1, ...points.map((p) => p[key] ?? 0)) * 1.05;
  const sx = (t) => (1 - (now - t) / HISTORY_SECONDS) * width;
  const sy = (v) => height - (v / top) * height;

  el("line", {x1: 0, x2: width, y1: height - 0.5, y2: height - 0.5, stroke: "var(--axis)"}, svg);
  el("line", {x1: 0, x2: width, y1: sy(1), y2: sy(1), stroke: "var(--text-muted)", "stroke-dasharray": "3 3"}, svg);
  el("text", {x: width, y: sy(1) - 3, "text-anchor": "end", class: "axis-text"}, svg).textContent = "limit";

  const valid = points.filter((p) => p[key] != null);
  if (valid.length > 1) {
    const d = valid.map((p, i) => `${i ? "L" : "M"}${sx(p.t).toFixed(1)},${sy(p[key]).toFixed(1)}`).join("");
    el("path", {d, fill: "none", stroke: "var(--usage)", "stroke-width": 2, "stroke-linejoin": "round"}, svg);
  }

  // Hover: nearest sample.
  const tooltip = container.querySelector(".tooltip");
  const marker = el("circle", {r: 4, fill: "var(--usage)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden"}, svg);
  const hit = el("rect", {x: 0, y: 0, width, height, fill: "transparent"}, svg);
  const show = (clientX) => {
    if (!valid.length) return;
    const x = clientX - svg.getBoundingClientRect().left;
    const t = now - (1 - x / width) * HISTORY_SECONDS;
    const p = valid.reduce((a, b) => (Math.abs(b.t - t) < Math.abs(a.t - t) ? b : a));
    marker.setAttribute("cx", sx(p.t));
    marker.setAttribute("cy", sy(p[key]));
    marker.setAttribute("visibility", "visible");
    tooltip.innerHTML = `<b>${escapeHtml(p[textKey])}</b> <span class="muted">${(p[key] * 100).toFixed(0)}% of limit · ${(now - p.t).toFixed(0)} s ago</span>`;
    tooltip.style.display = "block";
    tooltip.style.left = `${Math.max(0, Math.min(sx(p.t) + 10, width - tooltip.offsetWidth))}px`;
    tooltip.style.top = `${Math.max(-8, sy(p[key]) - 34)}px`;
  };
  hit.addEventListener("pointermove", (event) => {
    hover = {key: hoverKey, clientX: event.clientX};
    show(event.clientX);
  });
  hit.addEventListener("pointerleave", () => {
    hover = null;
    tooltip.style.display = "none";
    marker.setAttribute("visibility", "hidden");
  });
  if (hover && hover.key === hoverKey) show(hover.clientX);
}

// ---------- events ----------

function renderEvents(data) {
  const icon = {info: ICONS.idle, warn: ICONS.warning, error: ICONS.critical};
  document.getElementById("log").innerHTML = data.events.slice().reverse().map((event) => {
    const time = new Date(event.time * 1000).toLocaleTimeString([], {hour12: false});
    return `<li><time>${time}</time><span title="${event.level}">${icon[event.level] || ""}</span><span>${escapeHtml(event.message)}</span></li>`;
  }).join("");
}

// ---------- polling ----------

let lastData = null;

async function refresh() {
  const connection = document.getElementById("connection");
  try {
    const response = await fetch(STATUS_URL, {cache: "no-store"});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    lastData = data;

    const age = Date.now() / 1000 - data.timestamp;
    connection.outerHTML = age < 3
      ? `<span class="status" id="connection">${ICONS.good}<span>Live</span></span>`
      : `<span class="status" id="connection">${ICONS.idle}<span>Last update ${Math.round(age)} s ago (manager stopped?)</span></span>`;
    document.getElementById("enforcement").outerHTML = data.cgroups
      ? `<span class="status" id="enforcement">${ICONS.good}<span>Budgets enforced (cgroup v2)</span></span>`
      : `<span class="status" id="enforcement">${ICONS.warning}<span>Budgets NOT enforced</span></span>`;
    document.getElementById("system").textContent = data.system;

    renderCores(data);
    renderNodes(data);
    renderEvents(data);
  } catch (error) {
    connection.outerHTML = `<span class="status" id="connection">${ICONS.warning}<span>Cannot read ${STATUS_URL} (${escapeHtml(error.message)})</span></span>`;
  }
}

window.addEventListener("resize", () => lastData && renderNodes(lastData));
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
